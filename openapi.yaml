components:
  schemas:
    Groep:
      oneOf:
      - $ref: '#/components/schemas/HoofdModelGroep'
      - $ref: '#/components/schemas/BasisModelGroep'
      title: Groep
    Cursus:
      oneOf:
      - $ref: '#/components/schemas/HoofdModelCursus'
      - $ref: '#/components/schemas/BasisModelCursus'
      title: Cursus
    Persoon:
      oneOf:
      - $ref: '#/components/schemas/HoofdModelPersoon'
      - $ref: '#/components/schemas/BasisModelPersoon'
      title: Persoon
    Student:
      oneOf:
      - $ref: '#/components/schemas/HoofdModelStudent'
      - $ref: '#/components/schemas/BasisModelStudent'
      title: Student
    Gebruiker:
      oneOf:
      - $ref: '#/components/schemas/HoofdModelGebruiker'
      - $ref: '#/components/schemas/BasisModelGebruiker'
      title: Gebruiker
    Stamgroep:
      oneOf:
      - $ref: '#/components/schemas/HoofdModelStamgroep'
      - $ref: '#/components/schemas/BasisModelStamgroep'
      title: Stamgroep
      deprecated: true
    Begeleider:
      oneOf:
      - $ref: '#/components/schemas/HoofdModelBegeleider'
      - $ref: '#/components/schemas/BasisModelBegeleider'
      title: Inschrijving
    Medewerker:
      oneOf:
      - $ref: '#/components/schemas/HoofdModelMedewerker'
      - $ref: '#/components/schemas/BasisModelMedewerker'
      title: Medewerker
    Aanstelling:
      oneOf:
      - $ref: '#/components/schemas/HoofdModelAanstelling'
      - $ref: '#/components/schemas/BasisModelAanstelling'
      title: Aanstelling
    Organisatie:
      oneOf:
      - $ref: '#/components/schemas/HoofdModelOrganisatie'
      - $ref: '#/components/schemas/BasisModelOrganisatie'
      title: Organisatie
    Inschrijving:
      oneOf:
      - $ref: '#/components/schemas/HoofdModelInschrijving'
      - $ref: '#/components/schemas/BasisModelInschrijving'
      title: Inschrijving
    ComponentAdres:
      type: object
      title: Adres component
      x-tags:
      - Componenten
      - Adressen
      required:
      - type
      - straat
      - postcode
      - plaats
      - huisnummer
      - land
      - staat
      - huisnummerOnderdelen
      - actief
      - actief
      properties:
        land:
          type: object
          required:
          - code
          - naam
          - engelseNaam
          properties:
            code:
              type: string
              description: ISO 3166-1 alpha-3 landcode
            naam:
              type: string
              description: Nederlanse landnaam
            engelseNaam:
              type: string
              description: Engelse landnaam
          description: Land
        type:
          enum:
          - woon
          - factuur
          - post
          type: string
          title: Type
          description: Type adres
        actief:
          $ref: '#/components/schemas/ComponentActief'
        plaats:
          type: string
          description: Plaats
        straat:
          type: string
          title: Waarde
          description: Straatnaam
        postcode:
          type: string
          description: Postcode
        huisnummer:
          type: string
          description: Huisnummer samengevoegd
        adresregels:
          type: array
          items:
            type: string
          description: Indien beschikbaar/aangeleverd adresregels
        huisnummerOnderdelen:
          type: object
          required:
          - basis
          properties:
