      - $ref: '#/components/parameters/QueryParameterUitbreiden'
      description: De beschikbare cursussen ophalen
      operationId: GetCursussen
  /studenten:
    get:
      tags:
      - Studenten
      summary: /studenten
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'
                title: GetStudentenOk
              example:
              - geslacht: vrouw
                roepnaam: Lisa
                gebruiker:
                  actief: true
                  identifier: AV12345@mc-eindhoven.nl
                  weergaveNaam: Lisa Peters
                achternaam: Peters
                identifier: AV12345
                stamgroepen:
                - naam: Stamgroep 1A
                  identifier: SG123
                geboortedatum: 2001-02-02
                inschrijvingen:
                - type: cursus
                  actief:
                    nu: true
                  status: ingeschreven
                  identifier: CURS123
                contactgegevens:
                - type: email
                  waarde: l.peters@edu.summacollege.nl
                  gebruik: organisatie
              - geslacht: man
                roepnaam: Bram
                gebruiker:
                  actief: true
                  identifier: PS54321@mc-eindhoven.nl
                  weergaveNaam: Bram de Vries
                achternaam: de Vries
                identifier: PS54321
                stamgroepen:
                - naam: Stamgroep 2B
