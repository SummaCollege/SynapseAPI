openapi: 3.0.0
info:
  title: Summa API Platform (Synapse) - Draft
  version: 0.1.1
  contact:
    url: https://www.summacollege.nl
    name: Summa College - Integratie en ontwikkeling
    email: devops@summacollege.nl
  description: |-
    # Summa Synapse
    Welkom bij de Summa College API documentatie! Deze API biedt toegang tot belangrijke gegevens over studenten, medewerkers en cursussen binnen onze onderwijsinstelling. Of je nu een ontwikkelaar bent die integraties bouwt of een applicatie wilt maken, deze documentatie helpt je op weg.

    ## Opzet van de API en endpoints

    - De API hanteert een duidelijke en consistente structuur voor alle endpoints: `/entiteit`, `/entiteit/{id}` en `/entiteit/{id}/subentiteit`.
    - Wanneer je een entiteit of subentiteit rechtstreeks via het pad opvraagt (zoals `/studenten/{id}` of `/studenten/{id}/inschrijvingen`), ontvang je altijd het meest uitgebreide (volledige) model van die resource.
    - Relaties tussen entiteiten (zoals stamgroepen of inschrijvingen bij een student) worden momenteel nog **NIET** als embedded object in responses opgenomen.
    - Hoewel de schema’s verschillende modeltypes (basis, hoofd, volledig) tonen, wordt er op dit moment per endpoint of relatie altijd één type response teruggegeven: volledig model zonder gerelateerde data (tenzij anders aangegeven).

    ## Toekomstige ontwikkelingen
    - We werken aan het verbeteren van de embedded relaties, zodat je in één keer alle benodigde data kunt ophalen zonder extra requests.
    - ** In de toekomst wordt het mogelijk om per relatie aan te geven of je deze wilt ophalen en in welke variant (basis- of hoofdmodel). **
      Zo kun je bijvoorbeeld bij het ophalen van een student straks kiezen om stamgroepen als hoofdmodel op te halen, maar inschrijvingen helemaal niet.
    - In de verre toekomst willen we naast onze eigen Synapse API ook vertaling maken naar de OOAPI standaard, zodat je ook OOAPI-conforme endpoints kunt gebruiken.
    - We blijven de API uitbreiden met nieuwe entiteiten en functionaliteit, dus houd deze documentatie in de gaten voor updates.
tags:
  - name: Personen
    description: |-
      **Persoonsinformatie**

      Informatie over studenten en medewerkers, zoals naam, geboortedatum en contactgegevens. Gebruik deze endpoints om basisgegevens van personen op te halen.
  - name: Gebruikers
    description: |-
      **Gebruikersgegevens (SSO)**

      Informatie over gebruikersaccounts afkomstig uit het Identity Provider (IDP) systeem. Handig voor Single Sign-On (SSO) en authenticatie.
  - name: Contactgegevens
    description: |-
      **Contactgegevens**

      Telefoonnummer(s) en e-mailadressen van personen, studenten en medewerkers. Gebruik deze endpoints om actuele contactinformatie op te vragen.
  - name: Studenten
    description: |-
      **Studentgegevens**

      Gegevens van en gerelateerd aan studenten, zoals inschrijvingen, stamgroepen en contactinformatie. Zie ook de voorbeelden bij de endpoints.
  - name: Inschrijvingen
    description: |-
      **Inschrijvingen**

      Informatie over inschrijvingen van studenten op opleidingen, arrangementen en cursussen. Handig voor het volgen van studievoortgang.
  - name: Medewerkers
    description: |-
      **Medewerkersgegevens**

      Gegevens van en gerelateerd aan medewerkers, inclusief aanstellingen en contactinformatie.
  - name: Stamgroepen
    description: |-
      **Stamgroepen**

      Stamgroepen koppelen studenten aan studiecoaches (studieloopbaanbegeleiders). Gebruik deze endpoints om groepsindelingen en begeleiders op te halen.
  - name: Aanstellingen
    description: |-
      **Aanstellingen**

      Informatie over aanstellingen van medewerkers bij verschillende organisatie-eenheden. Zie de voorbeelden voor structuur.
  - name: Cursussen
    description: |-
      **Cursusgegevens**

      Gegevens over aangeboden cursussen, zoals naam, code en status. Gebruik deze endpoints om cursusinformatie op te halen.
  - name: Groepen
    description: |-
      **Groepen**

      Groepen koppelen studenten o.a. aan studiecoaches (studieloopbaanbegeleiders). Gebruik deze endpoints om groepsindelingen en begeleiders op te halen.
  - name: Studentbegeleiders
    description: |-
      **Studentbegeleiders**

      Gebruik deze endpoints om de begeleiders van een student op te halen.
  - name: Adressen
    description: |-
      **Addressen**

      Adressen van personen, studenten en medewerkers. Gebruik deze endpoints om actuele adresgegevens op te vragen.
  - name: Organisaties
    description: |-
      **Organisaties**

      Gegevens van en gerelateerd aan organisaties, zoals inschrijvingen en contactinformatie. Zie ook de voorbeelden bij de endpoints.
  - name: Componenten
    description: |-
      **Componenten**

      Dit zijn kleine herbruikbare componenten die in verschillende schema's terug komen.
paths:
  /cursussen:
    get:
      operationId: GetCursussen
      summary: /cursussen
      description: De beschikbare cursussen ophalen
      parameters:
        - $ref: '#/components/parameters/QueryParameterVelden'
        - $ref: '#/components/parameters/QueryParameterUitbreiden'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasisModelCursus'
        '400':
          description: Ongeldige aanvraag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foutrespons'
        '404':
          description: Niet gevonden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foutrespons'
        '500':
          description: Interne serverfout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foutrespons'
        '502':
          description: Bad gateway.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foutrespons'
      tags:
        - Cursussen
  /cursussen/{identifier}:
    get:
      operationId: GetCursus
      summary: /cursussen/{identifier}
      description: De opgegeven cursus ophalen
      parameters:
        - $ref: '#/components/parameters/PadParameterCursusIdentifier'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolledigModelCursus'
      tags:
        - Cursussen
  /groepen:
    get:
      operationId: GetGroepen
      summary: /groepen
      description: Alle (actieve) groepen ophalen
      parameters:
        - $ref: '#/components/parameters/QueryParameterVelden'
        - $ref: '#/components/parameters/QueryParameterUitbreiden'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Groep'
        '400':
          description: Ongeldige aanvraag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foutrespons'
        '404':
          description: Niet gevonden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foutrespons'
        '500':
          description: Interne serverfout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foutrespons'
        '502':
          description: Bad gateway.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foutrespons'
      tags:
        - Groepen
  /groepen/{identifier}:
    get:
      operationId: GetGroep
      summary: /groepen/{identifier}
      description: Een enkele groep ophalen
      parameters:
        - name: identifier
          in: path
          required: true
          description: Unieke identifier van de groep.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolledigModelGroep'
      tags:
        - Groepen
  /medewerkers:
    get:
      operationId: GetMedewerkers
      summary: /medewerkers
      description: Alle medewerkers ophalen
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Medewerker'
      tags:
        - Medewerkers
  /medewerkers/{identifier}:
    get:
      operationId: GetMedewerker
      summary: /medewerkers/{identifier}
      description: Een specifieke medewerker ophalen
      parameters:
        - $ref: '#/components/parameters/PadParameterMedewerkerIdentifier'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolledigModelMedewerker'
      tags:
        - Medewerkers
  /medewerkers/{identifier}/aanstellingen:
    get:
      operationId: GetMedewerkerAanstellingen
      summary: /medewerkers/{identifier}/aanstellingen
      description: De aanstellingen van een specifieke medewerker opvragen
      parameters:
        - $ref: '#/components/parameters/PadParameterMedewerkerIdentifier'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolledigModelAanstelling'
      tags:
        - Medewerkers
        - Aanstellingen
  /medewerkers/{identifier}/adressen:
    get:
      operationId: getAdressen
      summary: /medewerkers/{identifier}/adressen
      description: De adressen van een specifieke medewerker opvragen
      parameters:
        - $ref: '#/components/parameters/PadParameterMedewerkerIdentifier'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentAdres'
      tags:
        - Medewerkers
        - Adressen
  /medewerkers/{identifier}/contactgegevens:
    get:
      operationId: GetMedewerkerContactGegevens
      summary: /medewerkers/{identifier}/contactgegevens
      description: De contactgegevens van een specifieke medewerker opvragen
      parameters:
        - $ref: '#/components/parameters/PadParameterMedewerkerIdentifier'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentContactgegeven'
      tags:
        - Contactgegevens
        - Medewerkers
  /medewerkers/{identifier}/gebruiker:
    get:
      operationId: GetMedewerkerGebruiker
      summary: /medewerkers/{identifier}/gebruiker
      description: De gebruiker voor een specifieke medewerker ophalen
      parameters:
        - $ref: '#/components/parameters/PadParameterMedewerkerIdentifier'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolledigModelGebruiker'
      tags:
        - Gebruikers
        - Medewerkers
  /organisaties:
    get:
      operationId: GetOrganisaties
      summary: /organisaties
      description: Alle organisaties ophalen
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organisatie'
      tags:
        - Organisaties
  /organisaties/{identifier}:
    get:
      operationId: GetOrganisatie
      summary: /organisaties/{identifier}
      description: Een specifieke organisatie ophalen
      parameters:
        - $ref: '#/components/parameters/PadParameterOrganisatieIdentifier'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolledigModelOrganisatie'
      tags:
        - Organisaties
  /stamgroepen:
    get:
      operationId: GetStamgroepen
      summary: /stamgroepen
      description: Alle stamgroepen ophalen
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stamgroep'
      tags:
        - Stamgroepen
      deprecated: true
  /stamgroepen/{identifier}:
    get:
      operationId: GetStamgroep
      summary: /stamgroepen/{identifier}
      description: Een enkele stamgroep ophalen
      parameters:
        - name: identifier
          in: path
          required: true
          description: Unieke identifier van de stamgroep.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolledigModelStamgroep'
      tags:
        - Stamgroepen
      deprecated: true
  /studenten:
    get:
      operationId: GetStudenten
      summary: /studenten
      description: Alle studenten ophalen
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'
      tags:
        - Studenten
  /studenten/{identifier}:
    get:
      operationId: GetStudent
      summary: /studenten/{identifier}
      description: Een specifieke student ophalen
      parameters:
        - $ref: '#/components/parameters/PadParameterStudentIdentifier'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolledigModelStudent'
      tags:
        - Studenten
  /studenten/{identifier}/adressen:
    get:
      operationId: GetStudentAdressen
      summary: /studenten/{identifier}/adressen
      description: De adressen van een specifieke student opvragen
      parameters:
        - $ref: '#/components/parameters/PadParameterStudentIdentifier'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentAdres'
      tags:
        - Studenten
        - Adressen
  /studenten/{identifier}/begeleiders:
    get:
      operationId: getBegeleiders
      summary: /studenten/{identifier}/begeleiders
      description: Alle begeleiders ophalen van de opgegeven student
      parameters:
        - name: identifier
          in: path
          required: true
          description: Unieke identifier van de student.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Begeleider'
      tags:
        - Studenten
        - Studentbegeleiders
  /studenten/{identifier}/contactgegevens:
    get:
      operationId: GetStudentContactGegevens
      summary: /studenten/{identifier}/contactgegevens
      description: De contactgegevens van een specifieke student opvragen
      parameters:
        - $ref: '#/components/parameters/PadParameterStudentIdentifier'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentContactgegeven'
      tags:
        - Contactgegevens
        - Studenten
  /studenten/{identifier}/gebruiker:
    get:
      operationId: GetStudentGebruiker
      summary: /studenten/{identifier}/gebruiker
      description: De gebruiker voor een specifieke student ophalen
      parameters:
        - $ref: '#/components/parameters/PadParameterStudentIdentifier'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolledigModelGebruiker'
      tags:
        - Studenten
        - Gebruikers
  /studenten/{identifier}/inschrijvingen:
    get:
      operationId: GetStudentInschrijvingen
      summary: /studenten/{identifier}/inschrijvingen
      description: De inschrijvingen van een specifieke student opvragen
      parameters:
        - $ref: '#/components/parameters/PadParameterStudentIdentifier'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoofdModelInschrijving'
      tags:
        - Inschrijvingen
components:
  parameters:
    PadParameterCursusIdentifier:
      name: identifier
      in: path
      required: true
      description: Een geldige identifier voor een cursus
      schema:
        type: string
        pattern: CURS[0-9]{1,8}
    PadParameterMedewerkerIdentifier:
      name: identifier
      in: path
      required: true
      description: Een geldige identifier voor een medewerker (uniek Summa personeelsnummer)
      schema:
        type: string
        pattern: '[0-9]{6}'
    PadParameterOrganisatieIdentifier:
      name: identifier
      in: path
      required: true
      description: Een geldige identifier voor een organisatie
      schema:
        type: string
        pattern: \w+
    PadParameterStudentIdentifier:
      name: identifier
      in: path
      required: true
      description: Een geldige identifier voor een student
      schema:
        type: string
        pattern: (?:AV[0-9]+)|(?:PS[0-9]+)
    QueryParameterUitbreiden:
      name: uitbreiden
      in: query
      required: false
      description: Lijst van subresources om uit te breiden, gescheiden door komma’s.
      schema:
        type: string
      explode: false
    QueryParameterVelden:
      name: velden
      in: query
      required: false
      description: Lijst van velden om op te halen, gescheiden door komma’s.
      schema:
        type: string
      explode: false
  schemas:
    Aanstelling:
      oneOf:
        - $ref: '#/components/schemas/HoofdModelAanstelling'
        - $ref: '#/components/schemas/BasisModelAanstelling'
      description: Aanstelling representatie (hoofd- of basismodel).
      title: Aanstelling
    AanstellingCategorie:
      type: string
      enum:
        - onderwijs
        - bedrijfsvoering
      description: Categorie van de aanstelling
    AanstellingFunctie:
      type: object
      required:
        - code
        - naam
        - groep
      properties:
        code:
          type: string
          description: Functiecode
          title: Code
        naam:
          type: string
          description: Functienaam
          title: Naam
        groep:
          type: string
          description: Functiegroep
          title: Groep
      description: Functiegegevens binnen een aanstelling.
      example:
        code: DOC
        naam: Docent
        groep: Onderwijs
    AanstellingModellen:
      oneOf:
        - $ref: '#/components/schemas/VolledigModelAanstelling'
        - $ref: '#/components/schemas/HoofdModelAanstelling'
        - $ref: '#/components/schemas/BasisModelAanstelling'
      description: Alle mogelijke aanstelling modellen.
      title: Aanstelling schema's
    AdresType:
      type: string
      enum:
        - woon
        - factuur
        - post
      description: Type adres
    BasisModelAanstelling:
      type: object
      required:
        - categorie
        - identifier
      properties:
        categorie:
          allOf:
            - $ref: '#/components/schemas/AanstellingCategorie'
          description: Categorie van de aanstelling
        identifier:
          allOf:
            - $ref: '#/components/schemas/IdentifierAanstelling'
          description: Unieke identifier van de aanstelling
      description: Basismodel voor een aanstelling.
      title: Basis model, aanstelling
      example:
        categorie: onderwijs
        identifier: AAN123
    BasisModelBegeleider:
      type: object
      properties:
        identifier:
          allOf:
            - $ref: '#/components/schemas/IdentifierMedewerker'
          description: Unieke medewerker identifier
      description: Basismodel voor een studentbegeleider.
      title: Basis model, begeleider
      example:
        identifier: '123456'
    BasisModelCursus:
      type: object
      required:
        - identifier
      properties:
        identifier:
          allOf:
            - $ref: '#/components/schemas/IdentifierCursus'
          description: Unieke identifier van de cursus
      description: Basismodel voor een cursus.
      title: Basis model, cursus
      example:
        identifier: CURS123
    BasisModelFoutMelding:
      type: object
      required:
        - code
        - melding
      properties:
        code:
          type: string
          description: Foutcode
          title: Code
        melding:
          type: string
          description: Foutmelding omschrijving
          title: Melding
      description: Basis foutmeldingsmodel.
      title: Basis model, foutmelding
      example:
        code: FOUT_404
        melding: De opgevraagde resource is niet gevonden.
    BasisModelGebruiker:
      type: object
      required:
        - identifier
      properties:
        identifier:
          allOf:
            - $ref: '#/components/schemas/IdentifierGebruiker'
          description: Unieke identifier van de gebruiker (UPN)
      description: Basismodel voor een gebruikersaccount.
      title: Basis model, gebruiker
      example:
        identifier: AV12345@mc-eindhoven.nl
    BasisModelGroep:
      type: object
      required:
        - identifier
      properties:
        identifier:
          allOf:
            - $ref: '#/components/schemas/IdentifierGroep'
          description: Unieke identifier van de groep
      description: Basismodel voor een groep.
      title: Basis model, groep
      example:
        identifier: 1234-1a-ST
    BasisModelInschrijving:
      type: object
      required:
        - type
        - identifier
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/InschrijvingType'
          description: Type van de inschrijving
        identifier:
          allOf:
            - $ref: '#/components/schemas/IdentifierInschrijving'
          description: Unieke identifier van de inschrijving
      description: Basismodel voor een inschrijving.
      title: Basis model, inschrijving
      example:
        type: cursus
        identifier: CURS123
    BasisModelMedewerker:
      type: object
      properties:
        identifier:
          allOf:
            - $ref: '#/components/schemas/IdentifierMedewerker'
          description: Unieke medewerker identifier
      description: Basismodel voor een medewerker.
      title: Basis model, medewerker
      example:
        identifier: '123456'
    BasisModelOrganisatie:
      type: object
      properties:
        identifier:
          allOf:
            - $ref: '#/components/schemas/IdentifierOrganisatie'
          description: Unieke identifier van de organisatie
      description: Basismodel voor een externe organisatie.
      title: Basis model, organisatie
      example:
        identifier: ORG-001
    BasisModelOrganisatieeenheid:
      type: object
      required:
        - type
        - identifier
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/OrganisatieeenheidType'
          description: Type organisatie-eenheid
        identifier:
          allOf:
            - $ref: '#/components/schemas/IdentifierOrganisatieeenheid'
          description: Unieke identifier van de organisatie-eenheid
        moedereenheid:
          allOf:
            - $ref: '#/components/schemas/BasisModelOrganisatieeenheid'
          description: Bovenliggende organisatie-eenheid (moedereenheid)
      description: Basismodel voor een interne organisatie-eenheid.
      title: Basis model, organisatie-eenheid
      example:
        type: team
        identifier: TEAM1
    BasisModelPersoon:
      type: object
      description: Basismodel voor een persoon.
      title: Basis model, persoon
    BasisModelStamgroep:
      type: object
      required:
        - identifier
      properties:
        naam:
          type: string
          description: Naam van de stamgroep
          title: Naam
        identifier:
          type: string
          description: Unieke identifier van de stamgroep
          title: Identifier
      description: Basismodel voor een stamgroep.
      title: Basis model, stamgroep
      deprecated: true
      example:
        identifier: SG123
        naam: Stamgroep 1A
    BasisModelStudent:
      type: object
      properties:
        identifier:
          allOf:
            - $ref: '#/components/schemas/IdentifierStudent'
          description: Unieke identifier van de student
      description: Basismodel voor een student.
      title: Basis model, student
      example:
        identifier: AV12345
    BegeleideStudentWrapper:
      type: object
      required:
        - studenten
      properties:
        studenten:
          allOf:
            - $ref: '#/components/schemas/Student'
          description: De begeleide student
      description: Begeleide student verpakking.
    Begeleider:
      oneOf:
        - $ref: '#/components/schemas/HoofdModelBegeleider'
