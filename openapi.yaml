      - naam
      - waarde
      properties:
        naam:
          enum:
          - debiteurnummer
          type: string
          default: debiteurnummer
          examples:
          - debiteurnummer
          description: De naam van de identifier (in het externe systeem, of afgeleid hiervan)
        waarde:
          type: string
          description: De identifier waarde (afhankelijk van systeem, altijd getoond als string)
        systeem:
          enum:
          - Eduarte
          type: string
          default: Eduarte
          examples:
          - Eduarte
          description: Het systeem waarin deze entiteit met deze identifier bekend is
